services:
  vpn-gateway:
    build: .
    image: vpn-subscription-gateway:latest
    container_name: vpn-subscription-gateway
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    ports:
      - "8787:8787"
      - "10000-10007:10000-10007"
    environment:
      - VSG_WEB_PORT=8787
      - VSG_PROXY_HOST=0.0.0.0
      - VSG_PROXY_PORT_BASE=10000
      - VSG_MAX_TUNNELS=8
      - VSG_PROXY_USER=user
      - VSG_PROXY_PASS=pass1234
      - VSG_WEB_USER=admin
      - VSG_WEB_PASS=admin123
      # - VSG_SUB_TOKEN=change-me-token
      # - VSG_SERVER_HOST=1.2.3.4
    volumes:
      - vsg-data:/data

volumes:
  vsg-data:
