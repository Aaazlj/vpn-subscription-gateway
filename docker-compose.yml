version: "3.9"

services:
  vpn-gateway:
    build: .
    container_name: vpn-subscription-gateway
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_MODULE
    ports:
      - "8787:8787"          # Web UI
      - "10000-10007:10000-10007"  # proxy ports per tunnel
    environment:
      - VSG_WEB_PORT=8787
      - VSG_PROXY_HOST=0.0.0.0
      - VSG_PROXY_PORT_BASE=10000
      - VSG_MAX_TUNNELS=8
      - VSG_PROXY_USER=user
      - VSG_PROXY_PASS=pass1234
      - VSG_WEB_USER=admin
      - VSG_WEB_PASS=admin123
      # - VSG_SUB_TOKEN=change-me-token
      # - VSG_SERVER_HOST=1.2.3.4   # 公网 IP,留空自动探测
    volumes:
      - vsg-data:/data

volumes:
  vsg-data:

